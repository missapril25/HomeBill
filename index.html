<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pasasav 日日有餘｜記帳小幫手</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef3f1;--ink:#1f2a3a;--mute:#7b8794;--jade:#5f8f86;--gold:#b99a5b;--rose:#c27c8a;--card:#fffffff0;--line:#dfe7e4;--r:22px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top) 0 0}
h1,h2,.serif{font-family:"Noto Serif TC","Songti TC",serif}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:260px;height:260px;background:#cfe3dc;top:-60px;left:-60px}
.bg i:nth-child(2){width:220px;height:220px;background:#eadfc6;bottom:80px;right:-70px;animation-delay:-6s}
.bg i:nth-child(3){width:200px;height:200px;background:#ecd5da;top:45%;left:-80px;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.2)}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;flex:none}.logo svg{width:100%;height:100%;overflow:visible}
.logo .rays{transform-origin:24px 24px;animation:spin 26s linear infinite}
.logo .home{transform-origin:24px 24px;animation:breathe 3.6s ease-in-out infinite}
.logo .core{transform-origin:24px 24px;animation:breathe 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.07)}}
.wm{font:italic 600 31px/1 "Cormorant Garamond","Noto Serif TC",serif;letter-spacing:.02em;background:linear-gradient(100deg,#8a6f35 20%,#ecd9a2 45%,#b99a5b 55%,#8a6f35 80%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.cn{font:700 14px "Noto Serif TC",serif;letter-spacing:.32em;margin-top:5px;white-space:nowrap}
.cn span{display:inline-block;animation:rise .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*.14s + .3s)}
.cn small{font:400 11px "Noto Sans TC",sans-serif;letter-spacing:.15em;color:var(--mute);margin-left:10px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:14px;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#splash small{color:var(--mute);letter-spacing:.3em;font-size:12px;animation:rise .8s 1.1s both}
#splash .logo.big{width:104px;height:104px;animation:pop 1s cubic-bezier(.2,1.3,.4,1) both}
#splash .wm.big{font-size:52px;animation:shine 5s linear infinite,rise .9s .2s both}
#splash .cn.big{font-size:20px;margin:0}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-90deg)}}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 8px;max-width:560px;margin:auto}
header>div>small{color:var(--mute);letter-spacing:.08em;font-size:12px}
h1{font-size:28px;letter-spacing:.35em;font-weight:700}
#lock{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:8px 16px;font:inherit;font-size:13px;color:var(--ink);transition:.3s}
#lock.on{background:var(--jade);color:#fff;border-color:var(--jade)}
main{max-width:560px;margin:auto;padding:8px 18px 130px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px #1f2a3a0d;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.ring{flex:none}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--gold);stroke-dasharray:264;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ring text{font:700 19px "Noto Serif TC",serif;fill:var(--ink);text-anchor:middle}
.hero b{font:700 26px "Noto Serif TC",serif;display:block}
.mute{color:var(--mute);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .card{margin:0 0 14px}
.row2 b{font:700 20px "Noto Serif TC",serif}
h2{font-size:17px;margin:20px 4px 10px;font-weight:700}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border-radius:18px;margin-bottom:10px;box-shadow:0 6px 18px #1f2a3a08;cursor:pointer;transition:transform .2s}
.item:active{transform:scale(.97)}
.ic{width:42px;height:42px;border-radius:14px;background:#e6efec;display:grid;place-items:center;font-size:20px;flex:none}
.item .m{flex:1;min-width:0}.item .m div:first-child{font-weight:500}
.item .a{text-align:right;font:700 15px "Noto Serif TC",serif}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;margin-top:2px}
.paid{background:#dcebe6;color:#3f7468}.over{background:#f6dde1;color:#a34d5d}.soon{background:#f4e9d0;color:#8d6f2e}.wait{background:#e9edf2;color:#5b6674}
.over.pulse{animation:pl 1.8s infinite}
@keyframes pl{50%{box-shadow:0 0 0 5px #c27c8a22}}
.alert{background:linear-gradient(120deg,#f6dde1,#f4e9d0);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;font-size:14px}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;background:#fffffff2;backdrop-filter:blur(14px);border-radius:36px;padding:6px;box-shadow:0 12px 36px #1f2a3a22;z-index:5}
nav button{border:0;background:none;font:inherit;font-size:13px;padding:9px 18px;border-radius:30px;color:var(--mute);transition:.35s}
nav button.on{background:var(--jade);color:#fff}
.fab{position:fixed;right:22px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:28px;box-shadow:0 10px 26px #b99a5b66;z-index:5;transition:transform .3s}
.fab:active{transform:rotate(90deg) scale(.9)}
.fab.hide{display:none}
input,select,textarea{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px #5f8f8622}
input:disabled,select:disabled,textarea:disabled{background:#f3f6f5;opacity:1}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow:auto;margin:10px 0}
.chips span{flex:none;padding:6px 14px;border-radius:20px;background:var(--card);font-size:13px;cursor:pointer;transition:.25s}
.chips span.on{background:var(--ink);color:#fff}
.btn{border:0;border-radius:16px;padding:13px;font:inherit;font-weight:500;background:var(--jade);color:#fff;width:100%;margin-top:14px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.g{background:#e6efec;color:var(--ink)}.btn.d{background:#f6dde1;color:#a34d5d}
.modal{position:fixed;inset:0;background:#1f2a3a55;z-index:20;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.open{display:flex;animation:fi .3s}
.panel{background:#fbfdfc;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom));animation:up .45s cubic-bezier(.2,.9,.25,1)}
.panel h2{margin-top:0}
@keyframes up{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jade),var(--gold));border-radius:9px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mon{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.mon div{flex:1;background:linear-gradient(var(--gold),#dcc89a);border-radius:6px 6px 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.mon div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute)}
#toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:30px;z-index:50;transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.in{animation:fi .5s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="logo big"><svg viewBox="0 0 48 48"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd9a2"/><stop offset="1" stop-color="#a98a47"/></linearGradient></defs><g class="rays" stroke="url(#gg)" stroke-width="2.2" stroke-linecap="round"><path d="M24 2.5v6" transform="rotate(0 24 24)"/><path d="M24 2.5v6" transform="rotate(45 24 24)"/><path d="M24 2.5v6" transform="rotate(90 24 24)"/><path d="M24 2.5v6" transform="rotate(135 24 24)"/><path d="M24 2.5v6" transform="rotate(180 24 24)"/><path d="M24 2.5v6" transform="rotate(225 24 24)"/><path d="M24 2.5v6" transform="rotate(270 24 24)"/><path d="M24 2.5v6" transform="rotate(315 24 24)"/></g><circle class="core" cx="24" cy="24" r="12.5" fill="url(#gg)"/><g class="home" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 24 L24 16.5 L32.5 24"/><path d="M18 22.5 V31.5 H30 V22.5"/><path d="M22 31.5 V26.5 H26 V31.5"/></g></svg></div><div class="wm big">Pasasav</div><div class="cn big"><span style="--i:0">日</span><span style="--i:1">日</span><span style="--i:2">有</span><span style="--i:3">餘</span></div><small>記帳小幫手</small></div>
<div class="bg"><i></i><i></i><i></i></div>
<header><div><div class="brand"><div class="logo"><svg viewBox="0 0 48 48"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd9a2"/><stop offset="1" stop-color="#a98a47"/></linearGradient></defs><g class="rays" stroke="url(#gg)" stroke-width="2.2" stroke-linecap="round"><path d="M24 2.5v6" transform="rotate(0 24 24)"/><path d="M24 2.5v6" transform="rotate(45 24 24)"/><path d="M24 2.5v6" transform="rotate(90 24 24)"/><path d="M24 2.5v6" transform="rotate(135 24 24)"/><path d="M24 2.5v6" transform="rotate(180 24 24)"/><path d="M24 2.5v6" transform="rotate(225 24 24)"/><path d="M24 2.5v6" transform="rotate(270 24 24)"/><path d="M24 2.5v6" transform="rotate(315 24 24)"/></g><circle class="core" cx="24" cy="24" r="12.5" fill="url(#gg)"/><g class="home" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 24 L24 16.5 L32.5 24"/><path d="M18 22.5 V31.5 H30 V22.5"/><path d="M22 31.5 V26.5 H26 V31.5"/></g></svg></div><div><div class="wm">Pasasav</div><div class="cn"><span style="--i:0">日</span><span style="--i:1">日</span><span style="--i:2">有</span><span style="--i:3">餘</span><small>記帳小幫手</small></div></div></div><small id="dt"></small></div><button id="lock"></button></header>
<main id="main"></main>
<button class="fab" id="fab">＋</button>
<nav id="nav"><button data-t="home" class="on">首頁</button><button data-t="list">紀錄</button><button data-t="stat">統計</button><button data-t="set">設定</button></nav>
<div class="modal" id="modal"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const CATS={水費:'💧',電費:'💡',瓦斯費:'🔥',第四台:'📺',網路費:'🌐',電話費:'📱',車輛保養:'🔧',牌照稅:'🚗',燃料稅:'⛽',房屋稅:'🏠',地價稅:'🌱',保險費:'🛡️',管理費:'🏢',其他:'✨'};
const bm=b=>b.month||(b.dueDate||'').slice(0,7);
const SL={paid:'已繳',over:'逾期',soon:'即將到期',wait:'待繳'};
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=()=>fmt(new Date());
const nt=n=>'NT$ '+Number(n||0).toLocaleString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const st=b=>{if(b.paidDate)return'paid';const d=(new Date(b.dueDate)-new Date(T()))/864e5;return d<0?'over':d<=7?'soon':'wait'};
let bills=[],tab='home',pw=sessionStorage.getItem('pw')||'',F={q:'',y:'all',c:'all',s:'all'},cur=null;
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
const api=()=>LS('api');

/* ---------- 資料層：有 API 網址就用 Google Sheet，否則使用本機示範模式 ---------- */
async function call(action,data={}){
  if(!api()){return local(action,data)}
  try{const r=await fetch(api(),{method:'POST',body:JSON.stringify({action,pw,...data})});return await r.json()}
  catch(e){return{ok:false,err:'無法連線，請檢查網路或網址'}}
}
function local(a,d){
  let L=JSON.parse(LS('bills')||'[]');const P=LS('lpw')||'1234';
  if(a==='list')return{ok:true,data:L};
  if(pw!==P)return{ok:false,err:'密碼錯誤'};
  if(a==='save'){const i=L.findIndex(x=>x.id===d.bill.id);i<0?L.push(d.bill):L[i]=d.bill}
  if(a==='del')L=L.filter(x=>x.id!==d.id);
  if(a==='setpw')LS('lpw',d.newpw);
  LS('bills',JSON.stringify(L));return{ok:true}
}
async function load(){const r=await call('list');if(r.ok)bills=r.data.map(b=>({...b,amount:+b.amount||0}));else toast(r.err);render()}

/* ---------- 小工具 ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200)}
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=nt(Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0)})}
const open=h=>{$('#panel').innerHTML=h;$('#modal').classList.add('open')};
const close=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id==='modal')close()};
const item=(b,i)=>`<div class="item in" style="animation-delay:${i*50}ms" onclick="edit('${b.id}')"><div class="ic">${CATS[b.category]||'✨'}</div><div class="m"><div>${b.category}</div><div class="mute"><b style="color:var(--gold);font-weight:500">${bm(b).replace('-','年')}月帳款</b> · ${b.paidDate?'繳於 '+b.paidDate:'應繳 '+b.dueDate}</div><span class="tag ${st(b)} ${st(b)=='over'?'pulse':''}">${SL[st(b)]}</span></div><div class="a">${nt(b.amount)}${b.invoiceNo?`<div class="mute" style="font:12px sans-serif">${b.invoiceNo}</div>`:''}</div></div>`;

/* ---------- 畫面 ---------- */
function render(){
  $('#dt').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  $('#lock').textContent=pw?'🔓 編輯中':'🔒 登入';$('#lock').className=pw?'on':'';
  $('.fab').classList.toggle('hide',tab==='set'||tab==='stat');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML={home,list,stat,set}[tab]();
  count();
  requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w);document.querySelectorAll('[data-h]').forEach(e=>e.style.height=e.dataset.h);const p=$('.pg');if(p)p.style.strokeDashoffset=p.dataset.o})
}
function home(){
  const m=T().slice(0,7),mb=bills.filter(b=>bm(b)===m),done=mb.filter(b=>b.paidDate);
  const rate=mb.length?done.length/mb.length:0;
  const un=bills.filter(b=>!b.paidDate).sort((a,b)=>a.dueDate>b.dueDate?1:-1);
  const warn=un.filter(b=>['over','soon'].includes(st(b)));
  const sum=a=>a.reduce((s,b)=>s+b.amount,0);
  const rec=[...bills].sort((a,b)=>(b.updatedAt||'')>(a.updatedAt||'')?1:-1).slice(0,5);
  return `${warn.length?`<div class="alert in">🔔 有 <b>${warn.length}</b> 筆帳單需要留意：${warn.slice(0,3).map(b=>b.category).join('、')}${warn.length>3?'…':''}</div>`:''}
  <div class="card hero in"><svg class="ring" width="104" height="104" viewBox="0 0 104 104"><circle class="tr" cx="52" cy="52" r="42"/><circle class="pg" cx="52" cy="52" r="42" transform="rotate(-90 52 52)" style="stroke-dashoffset:264" data-o="${264*(1-rate)}"/><text x="52" y="59">${Math.round(rate*100)}%</text></svg>
  <div><div class="mute">本月已繳</div><b data-n="${sum(done)}">0</b><div class="mute">${done.length} / ${mb.length} 筆完成</div></div></div>
  <div class="row2"><div class="card in"><div class="mute">待繳總額</div><b data-n="${sum(un)}">0</b></div><div class="card in"><div class="mute">待繳筆數</div><b>${un.length} 筆</b></div></div>
  <h2>待繳提醒</h2>${un.slice(0,6).map(item).join('')||'<div class="empty">🌿 目前沒有待繳項目</div>'}
  <h2>最近更新</h2>${rec.map(item).join('')||'<div class="empty">尚無紀錄，點右下角「＋」新增第一筆</div>'}`;
}
function list(){
  const ys=[...new Set(bills.map(b=>bm(b).slice(0,4)))].sort().reverse();
  const L=bills.filter(b=>(F.y==='all'||bm(b).startsWith(F.y))&&(F.m==='all'||!F.m||bm(b).slice(5)===F.m)&&(F.c==='all'||b.category===F.c)&&(F.s==='all'||st(b)===F.s||(F.s==='todo'&&!b.paidDate))&&(!F.q||(b.category+b.invoiceNo+b.note+b.dueDate+bm(b)).includes(F.q))).sort((a,b)=>(bm(a)+a.dueDate)<(bm(b)+b.dueDate)?1:-1);
  return `<input id="q" placeholder="🔍 搜尋項目、發票號碼、備註" value="${F.q}" oninput="F.q=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();$('#q').focus();$('#q').setSelectionRange(99,99)},350)">
  <div class="row2" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr"><select onchange="F.m=this.value;render()"><option value="all">全部月份</option>${[...Array(12)].map((_,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${F.m==v?'selected':''}>${i+1} 月</option>`})}</select><select onchange="F.y=this.value;render()"><option value="all">全部年份</option>${ys.map(y=>`<option ${F.y==y?'selected':''}>${y}</option>`)}</select><select onchange="F.c=this.value;render()"><option value="all">全部項目</option>${Object.keys(CATS).map(c=>`<option ${F.c==c?'selected':''}>${c}</option>`)}</select></div>
  <div class="chips">${[['all','全部'],['todo','未繳'],['over','逾期'],['paid','已繳']].map(([k,v])=>`<span class="${F.s==k?'on':''}" onclick="F.s='${k}';render()">${v}</span>`).join('')}</div>
  <div class="mute" style="margin:0 4px 10px">共 ${L.length} 筆，合計 ${nt(L.reduce((s,b)=>s+b.amount,0))}</div>
  ${L.map(item).join('')||'<div class="empty">找不到符合的紀錄</div>'}`;
}
function stat(){
  const ys=[...new Set([T().slice(0,4),...bills.map(b=>bm(b).slice(0,4))])].sort().reverse(),y=F.sy||ys[0];
  const L=bills.filter(b=>bm(b).startsWith(y)),by={},mo=Array(12).fill(0);
  L.forEach(b=>{by[b.category]=(by[b.category]||0)+b.amount;mo[+bm(b).slice(5,7)-1]+=b.amount});
  const mx=Math.max(...Object.values(by),1),mm=Math.max(...mo,1),tot=L.reduce((s,b)=>s+b.amount,0);
  return `<select onchange="F.sy=this.value;render()">${ys.map(v=>`<option ${v==y?'selected':''}>${v}</option>`)}</select>
  <div class="card in" style="margin-top:14px"><div class="mute">${y} 年度總支出</div><b class="serif" style="font-size:28px" data-n="${tot}">0</b></div>
  <div class="card in"><div class="mute">每月支出</div><div class="mon">${mo.map((v,i)=>`<div data-h="${v/mm*100}%"><span>${i+1}</span></div>`).join('')}</div><div style="height:18px"></div></div>
  <div class="card in"><div class="mute" style="margin-bottom:8px">各項目占比</div>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${CATS[k]||''} ${k}</span><span class="serif">${nt(v)}</span></div><div class="bar"><i data-w="${v/mx*100}%"></i></div></div>`).join('')||'<div class="empty">此年度尚無資料</div>'}</div>`;
}
function set(){
  return `<div class="card in"><b>資料來源</b><div class="mute">${api()?'✅ 已連接 Google 試算表':'📱 示範模式（資料只存在本機）'}</div>
  <label>Google Apps Script 網址</label><input id="api" placeholder="https://script.google.com/macros/s/…/exec" value="${api()}"><button class="btn" onclick="LS('api',$('#api').value.trim());toast('已儲存');load()">儲存並同步</button></div>
  <div class="card in"><b>匯出與提醒</b><button class="btn g" onclick="exp()">📊 匯出 Excel</button><button class="btn g" onclick="notif()">🔔 開啟到期通知</button><button class="btn g" onclick="load();toast('已重新整理')">🔄 重新整理資料</button></div>
  <div class="card in"><b>安全</b>${pw?`<label>新密碼（至少 4 碼）</label><input id="np" type="password"><button class="btn" onclick="setpw()">更改密碼</button><button class="btn g" onclick="out()">登出（改為僅檢視）</button>`:'<div class="mute">登入後才能更改密碼</div>'}</div>
  <div class="mute" style="text-align:center">未登入時僅能檢視，登入後可新增、編輯、刪除。</div>`;
}

/* ---------- 編輯表單 ---------- */
function edit(id){
  cur=id?bills.find(b=>b.id===id):null;const b=cur||{category:'水費',month:T().slice(0,7),dueDate:T(),repeat:'0',amount:'',paidDate:'',invoiceNo:'',note:''},d=pw?'':'disabled';
  if(!cur&&!pw)return login();
  open(`<h2>${cur?(pw?'編輯帳單':'帳單內容'):'新增帳單'}</h2>
  <label>項目</label><select id="f1" ${d}>${Object.keys(CATS).map(c=>`<option ${b.category==c?'selected':''}>${c}</option>`)}</select>
  <label>帳款月份（此筆帳款屬於幾月）</label><input id="f8" type="month" value="${bm(b)||b.month}" ${d}>
  <label>金額</label><input id="f2" type="number" inputmode="decimal" value="${b.amount}" ${d}>
  <div class="row2"><div><label>應繳日期</label><input id="f3" type="date" value="${b.dueDate}" ${d}></div><div><label>繳費日期</label><input id="f4" type="date" value="${b.paidDate}" ${d}></div></div>
  <label>發票號碼</label><input id="f5" value="${b.invoiceNo}" placeholder="例如 AB-12345678" ${d}>
  <label>重複週期（繳費後自動建立下一期）</label><select id="f6" ${d}>${[['0','不重複'],['1','每月'],['2','每兩個月'],['12','每年']].map(([v,t])=>`<option value="${v}" ${b.repeat==v?'selected':''}>${t}</option>`)}</select>
  <label>備註</label><textarea id="f7" rows="2" ${d}>${b.note}</textarea>
  ${pw?`<button class="btn g" onclick="$('#f4').value=T()">✓ 標記今天已繳</button><button class="btn" onclick="save()">儲存</button>${cur?'<button class="btn d" onclick="del()">刪除</button>':''}`:'<button class="btn g" onclick="login()">登入後可編輯</button>'}`);
}
async function save(){
  const b={id:cur?cur.id:uid(),category:$('#f1').value,month:$('#f8').value,amount:$('#f2').value,dueDate:$('#f3').value,paidDate:$('#f4').value,invoiceNo:$('#f5').value.trim(),repeat:$('#f6').value,note:$('#f7').value.trim(),updatedAt:T()};
  if(!b.amount||!b.dueDate||!b.month)return toast('請填寫帳款月份、金額與應繳日期');
  const r=await call('save',{bill:b});if(!r.ok){if(/密碼/.test(r.err))out();return toast(r.err)}
  if(b.paidDate&&+b.repeat&&(!cur||!cur.paidDate)){const d=new Date(b.dueDate+'T00:00');d.setMonth(d.getMonth()+ +b.repeat);const [yy,mm]=b.month.split('-'),nm=fmt(new Date(+yy,+mm-1+ +b.repeat,1)).slice(0,7);await call('save',{bill:{...b,id:uid(),month:nm,dueDate:fmt(d),paidDate:'',invoiceNo:''}})}
  close();toast(b.paidDate?'🌿 已記錄繳費':'已儲存');load();
}
async function del(){if(!confirm('確定刪除這筆紀錄？'))return;const r=await call('del',{id:cur.id});close();toast(r.ok?'已刪除':r.err);load()}

/* ---------- 登入 ---------- */
function login(){open(`<h2>輸入密碼</h2><div class="mute">登入後即可新增與編輯${api()?'':'（示範模式預設密碼 1234）'}</div><label>密碼</label><input id="pp" type="password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">登入</button>`);setTimeout(()=>$('#pp').focus(),400)}
async function doLogin(){pw=$('#pp').value;const r=await call('login');if(r.ok){sessionStorage.setItem('pw',pw);close();toast('登入成功');render()}else{pw='';toast(r.err||'密碼錯誤')}}
function out(){pw='';sessionStorage.removeItem('pw');toast('已登出');render()}
async function setpw(){const r=await call('setpw',{newpw:$('#np').value});if(r.ok){pw=$('#np').value;sessionStorage.setItem('pw',pw);toast('密碼已更新')}else toast(r.err)}

/* ---------- 匯出、通知 ---------- */
function exp(){
  const rows=[...bills].sort((a,b)=>(bm(a)+a.dueDate)<(bm(b)+b.dueDate)?1:-1).map(b=>({帳款月份:bm(b),項目:b.category,金額:b.amount,應繳日期:b.dueDate,繳費日期:b.paidDate,發票號碼:b.invoiceNo,狀態:SL[st(b)],備註:b.note}));
  if(!rows.length)return toast('目前沒有資料可匯出');
  if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'繳費紀錄');XLSX.writeFile(wb,'家庭繳費紀錄_'+T()+'.xlsx')}
  else{const k=Object.keys(rows[0]),c='\ufeff'+[k,...rows.map(r=>k.map(x=>`"${r[x]}"`))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='家庭繳費紀錄.csv';a.click()}
  toast('已匯出');
}
async function notif(){
  if(!('Notification' in window))return toast('此裝置不支援通知');
  const p=await Notification.requestPermission();toast(p==='granted'?'已開啟，開啟 APP 時會提醒':'未允許通知');if(p==='granted')ping();
}
function ping(){
  const w=bills.filter(b=>['over','soon'].includes(st(b)));
  if(w.length&&window.Notification&&Notification.permission==='granted')new Notification('Pasasav 日日有餘',{body:`有 ${w.length} 筆帳單逾期或即將到期：`+w.slice(0,3).map(b=>b.category).join('、')});
}

/* ---------- 啟動 ---------- */
$('#lock').onclick=()=>pw?out():login();
$('#fab').onclick=()=>edit();
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render();scrollTo({top:0,behavior:'smooth'})}};
load().then(ping);
if(sessionStorage.getItem('sp'))$('#splash').remove();else{sessionStorage.setItem('sp',1);setTimeout(()=>$('#splash').classList.add('out'),2000);setTimeout(()=>$('#splash').remove(),2800)}
</script>
</body>
</html>
